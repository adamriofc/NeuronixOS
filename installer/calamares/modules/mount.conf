# NEURONIX Calamares Mount Module Configuration
# Mounts partitions before running the install engine

# Filesystem type to use
extraMounts:
  - device: "swap"
    fs: "swap"
    mountPoint: "none"

# EFI system partition
extraMountsEfi:
  - device: "/dev/disk/by-label/EFI"
    fs: "vfat"
    mountPoint: "/mnt/boot"
