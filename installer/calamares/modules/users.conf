# NixOS creates the account; Calamares' patched users job sets its password
# inside the installed root after the declarative engine succeeds.
defaultGroups: [ users, networkmanager, wheel, video, audio ]
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
  minLength: 8
  maxLength: 128
allowWeakPasswords: false
user:
  shell: /run/current-system/sw/bin/bash
  forbidden_names: [ root, nixos ]
hostname:
  location: None
  writeHostsFile: false
  template: "${first}-neuronix"
  forbidden_names: [ localhost ]
