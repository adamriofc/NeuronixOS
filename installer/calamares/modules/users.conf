# NEURONIX Calamares Users Module Configuration
# Handles user account creation during installation

# Default user settings
defaultUser: "neuronix"
defaultPassword: "neuronix"
userShell: "/run/current-system/sw/bin/bash"

# Auto-login for live session (not installed system)
autologinGroup: "wheel"

# Do not require root password
requireAllGroups: false

# Show password options in the user page
showPassword: true
showAdvanced: true

# Allow setting hostname from user page
editableHostname: true
defaultHostname: "neuronix-box"
