# NEURONIX Installer Engine Shellprocess Configuration for Calamares
# Executes the declarative NixOS generation and target deployment engine
i18n:
  name: "Executing NEURONIX OS Declarative Installation Engine..."

dontChroot: true
timeout: 3600
verbose: true

script:
  # Global Storage substitutions are shell-quoted by Calamares. The users job
  # applies the password inside the target after the engine creates the account.
  - command: >-
      env NEURONIX_CALAMARES=1 TARGET_ROOT=${ROOT} TARGET_USER=${USER}
      TARGET_HOSTNAME=${gs[hostname]}
      TARGET_TIMEZONE=${gs[locationRegion]}/${gs[locationZone]}
      TARGET_LOCALE=${gs[localeConf.LANG]}
      TARGET_KEYBOARD_LAYOUT=${gs[keyboardLayout]}
      TARGET_KEYBOARD_VARIANT=${gs[keyboardVariant]}
      neuronix-install-engine
