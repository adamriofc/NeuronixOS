# NEURONIX Installer Engine Shellprocess Configuration for Calamares
# Executes the declarative NixOS generation and target deployment engine
i18n:
  name: "Executing NEURONIX OS Declarative Installation Engine..."

dontChroot: true
timeout: 1800

script:
  - command: "if command -v neuronix-install-engine >/dev/null 2>&1; then neuronix-install-engine; elif [ -x /etc/calamares/scripts/neuronix-install-engine.sh ]; then /etc/calamares/scripts/neuronix-install-engine.sh; elif [ -x /usr/local/bin/neuronix-install-engine ]; then /usr/local/bin/neuronix-install-engine; else TARGET_ROOT=/mnt bash $(find / -name neuronix-install-engine.sh 2>/dev/null | head -n 1); fi"
    name: "neuronix-engine"
