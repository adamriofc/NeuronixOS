name: NEURONIX OS Official Live ISO Builder & Publisher

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to attach ISO artifacts to (e.g. v1.0.3)'
        required: true
        default: 'v1.0.4'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish-iso:
    name: Build & Publish Live Installation ISO (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with Flakes Support
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/3ed67ec0a4d3c7ab4ae1f04f8ee8df07bfa506a2.tar.gz

      - name: Magic Nix Cache (Continuous Binary Caching)
        uses: DeterminateSystems/magic-nix-cache-action@v8
        continue-on-error: true
        with:
          use-flakehub: false

      - name: Enforce Exact Commit SHA Lineage & Release Gate Assurance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag || 'v1.0.4' }}"
          echo "================================================================================"
          echo "         NEURONIX RELEASE LINEAGE & CI GATE ENFORCEMENT VERIFICATION"
          echo "================================================================================"
          echo "Release Tag: ${TAG}"
          echo "Release Commit SHA: ${TARGET_SHA}"

          # Ensure HEAD matches release tag commit if tag is available
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$TARGET_SHA" != "$TAG_COMMIT" ]; then
              echo "::error::Release blocked: HEAD commit (${TARGET_SHA}) does not match tag commit (${TAG_COMMIT}) for ${TAG}!"
              exit 1
            fi
            echo "Tag commit SHA matches HEAD commit SHA (${TAG_COMMIT})"
          fi

          if [ -n "${GITHUB_TOKEN:-}" ] && [ "${ALLOW_UNVERIFIED_CI:-0}" != "1" ]; then
            echo "Querying GitHub CI Commit Status for ${TARGET_SHA}..."
            MAX_WAIT=600
            INTERVAL=15
            ELAPSED=0
            STATUS_STATE="unknown"
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              STATUS_RESP=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/commits/${TARGET_SHA}/status" || true)
              STATUS_STATE=$(echo "$STATUS_RESP" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('state', 'unknown'))" 2>/dev/null || echo "unknown")
              echo "[${ELAPSED}s] GitHub Commit Status for ${TARGET_SHA}: ${STATUS_STATE}"
              if [ "$STATUS_STATE" = "success" ]; then
                break
              elif [ "$STATUS_STATE" = "failure" ] || [ "$STATUS_STATE" = "error" ]; then
                echo "::error::Release blocked: CI failed on commit ${TARGET_SHA} with state '${STATUS_STATE}'!"
                exit 1
              fi
              echo "CI is running (${STATUS_STATE}). Waiting ${INTERVAL}s for verification gate completion..."
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            done
            if [ "$STATUS_STATE" != "success" ]; then
              echo "::error::Release blocked: Strict release governance requires green CI ('success') on exact commit ${TARGET_SHA}, but got '${STATUS_STATE}'!"
              exit 1
            fi
            echo "Green CI certified by GitHub Commit Status API for ${TARGET_SHA}"
          fi

          echo "Executing Semantic Closure & Subsystem Invariants Gate on exact release commit..."
          python3 -m unittest tests/test_semantic_closure.py

          echo "Compiling and binding assurance evidence for exact release commit ${TARGET_SHA}..."
          python3 tools/compile_evidence.py 34306803041 "${TARGET_SHA}"
          python3 tools/generate_evidence_graph.py
          python3 tools/generate_verification_passport.py
          python3 tools/generate_release_proof.py

          PASSPORT_FILE="dist/verification-passport.json"
          ASSURANCE_FILE="data/assurance_record.json"

          if [ ! -f "$PASSPORT_FILE" ]; then
            echo "::error::Missing authoritative verification passport at ${PASSPORT_FILE}"
            exit 1
          fi

          PASSPORT_SHA=$(python3 -c "import json; print(json.load(open('${PASSPORT_FILE}'))['release_metadata']['commit_sha'])")
          if [ "$PASSPORT_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Release commit SHA mismatch! Tag commit (${TARGET_SHA}) != Passport commit (${PASSPORT_SHA})"
            exit 1
          fi
          echo "Passport commit SHA matches release tag commit SHA (${TARGET_SHA})"

          ASSURANCE_SHA=$(python3 -c "import json; print(json.load(open('${ASSURANCE_FILE}'))['last_verified_commit_sha'])")
          if [ "$ASSURANCE_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Release commit SHA mismatch! Tag commit (${TARGET_SHA}) != Assurance record commit (${ASSURANCE_SHA})"
            exit 1
          fi
          echo "Assurance record commit SHA matches release tag commit SHA (${TARGET_SHA})"

          echo "Executing Offline Standalone Verification Engine on exact release artifacts..."
          python3 tools/verify_passport.py dist/verification-passport.json --graph --trace release
          python3 tools/verify_passport.py dist/neuronix-os-v1.0.4.proof.json

          echo "================================================================================"
          echo "ALL RELEASE LINEAGE & INTEGRITY GATES CERTIFIED FOR COMMIT ${TARGET_SHA}"
          echo "================================================================================"

      - name: Compile Official Live ISO Installer
        env:
          NEURONIX_SIGNING_KEY: ${{ secrets.NEURONIX_SIGNING_KEY }}
          NEURONIX_ALLOW_INSECURE_DEV_KEY: ${{ secrets.NEURONIX_SIGNING_KEY != '' && '0' || '1' }}
        run: |
          mkdir -p dist
          nix build .#packages.x86_64-linux.iso --out-link result-iso
          ISO_FILE=$(find result-iso/iso -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "::error::Compiled ISO not found in result-iso/iso"
            exit 1
          fi
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag || 'v1.0.4' }}"
          TARGET_NAME="neuronix-os-${TAG}-x86_64.iso"
          cp "$ISO_FILE" "dist/${TARGET_NAME}"
          ISO_SIZE=$(stat -c%s "dist/${TARGET_NAME}")
          echo "Compiled ISO size: ${ISO_SIZE} bytes"
          cd dist
          sha256sum "${TARGET_NAME}" > SHA256SUMS
          if [ "$ISO_SIZE" -ge 2140000000 ]; then
            echo "ISO exceeds GitHub Release asset limit (2 GiB). Splitting into multipart archives..."
            split -b 1500M "${TARGET_NAME}" "${TARGET_NAME}.part_"
            sha256sum ${TARGET_NAME}.part_* >> SHA256SUMS
            rm "${TARGET_NAME}"
            printf '%s\n' \
              "================================================================================" \
              "NEURONIX OS Official Live Installation ISO - Multipart Recombination Guide" \
              "================================================================================" \
              "" \
              "This release asset was published as multipart chunks to adhere to GitHub Release" \
              "per-asset file size constraints (max 2 GiB)." \
              "" \
              "To reassemble the complete, bootable ISO image:" \
              "" \
              "[On Linux & macOS]:" \
              "  cat neuronix-os-*-x86_64.iso.part_* > neuronix-os-${TAG}-x86_64.iso" \
              "  sha256sum -c SHA256SUMS" \
              "" \
              "[On Windows (Command Prompt)]:" \
              "  copy /b neuronix-os-*-x86_64.iso.part_aa + neuronix-os-*-x86_64.iso.part_ab neuronix-os-${TAG}-x86_64.iso" \
              "" \
              "Verify the reconstructed ISO with:" \
              "  sha256sum -c SHA256SUMS" \
              "================================================================================" \
              > RECOMBINE_INSTRUCTIONS.txt
          fi
          echo "Generated Checksum Database:"
          cat SHA256SUMS
          cd ..
          bash installer/scripts/sign_release.sh sign
          bash installer/scripts/generate_sbom.sh "${TAG}"
          bash installer/scripts/generate_release_manifest.sh "${TAG}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Upload ISO Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag || 'v1.0.4' }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
