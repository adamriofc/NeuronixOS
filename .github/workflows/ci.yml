name: NEURONIX OS Industrial CI & Resilience Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  test-and-verify:
    name: Industrial Systems Verification & Release Gate (1353 Assertions + Reproducibility)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with Flakes Support
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/3ed67ec0a4d3c7ab4ae1f04f8ee8df07bfa506a2.tar.gz

      - name: Setup Hypervisor Tools & Local Environment
        run: |
          sudo apt-get update -qy && sudo apt-get install -qy qemu-utils qemu-system-x86 bubblewrap age
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p ~/.local/bin
          ln -sf "$PWD/bin/neuronix" ~/.local/bin/neuronix
          echo "$PWD/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          cargo build --release --manifest-path packages/neuronix-daemon/Cargo.toml
          ln -sf "$PWD/packages/neuronix-daemon/target/release/neuronix-daemon" ~/.local/bin/neuronix-daemon
          cargo build --release --manifest-path packages/conductor/Cargo.toml
          ln -sf "$PWD/packages/conductor/target/release/conductor" ~/.local/bin/conductor
          if ! command -v age >/dev/null 2>&1; then
            cargo install rage --locked
            ln -sf "$HOME/.cargo/bin/rage" ~/.local/bin/age
            ln -sf "$HOME/.cargo/bin/rage-keygen" ~/.local/bin/age-keygen
          fi

      - name: Flake Syntax & Derivation Proof
        run: |
          nix-instantiate --parse flake.nix
          nix-instantiate --parse version.nix
          nix-instantiate --parse hosts/iso/default.nix
          nix-instantiate --parse hosts/desktop/default.nix
          nix-instantiate --parse packages/neuronix-cli/default.nix
          nix-instantiate --parse packages/neuronix-center/default.nix
          nix-instantiate --parse packages/opencode/default.nix
          nix-instantiate --parse modules/hardware/boot.nix
          nix-instantiate --parse modules/hardware/secureboot.nix
          nix-instantiate --parse modules/hardware/nvidia-prime.nix
          nix-instantiate --parse modules/hardware/tuning.nix
          nix-instantiate --parse modules/services/storage.nix
          nix-instantiate --parse modules/services/flatpak.nix
          nix-instantiate --parse modules/services/opencode.nix
          nix-instantiate --parse modules/services/update.nix
          nix-instantiate --parse modules/services/mesh.nix
          nix-instantiate --parse modules/services/desktop-tweaks.nix
          nix-instantiate --parse modules/core/manual.nix
          nix-instantiate --parse modules/core/sentinel.nix
          nix-instantiate --parse modules/platform.nix
          nix-instantiate --parse modules/services/daemon.nix
          nix-instantiate --parse modules/services/conductor.nix
          nix-instantiate --parse modules/security/ebpf-lsm.nix
          nix-instantiate --parse modules/security/lanzaboote.nix
          nix-instantiate --parse packages/neuronix-daemon/default.nix
          nix-instantiate --parse packages/conductor/default.nix
          nix-instantiate --parse packages/conductor-runtime/default.nix
          nix-instantiate --parse packages/conductor-mcp/default.nix

      - name: Execute Distro Verification Suite (209 Tests)
        run: |
          bash tests/test_distro_suite.sh

      - name: Execute Master Test Harness (899 Tests)
        run: |
          bash tests/run_all_tests.sh


      - name: Verify System Embedded Manual & AI Reference (44 Tests)
        run: |
          bash tests/test_system_manual.sh

      - name: Execute Core CLI Verification (14 Tests)
        run: |
          bash tests/test_neuronix_core.sh

      - name: Verify Single Source of Truth (13 Tests)
        run: |
          bash tests/test_source_of_truth.sh

      - name: Verify Multi-Architecture Evaluation Matrix (13 Tests)
        run: |
          bash tests/test_multiarch_matrix.sh

      - name: Verify Two-Build Functional Reproducibility (8 Tests)
        run: |
          bash tests/test_two_build_reproducibility.sh

      - name: Verify Multi-Hop Rollback Correctness (13 Tests)
        run: |
          bash tests/test_rollback_correctness.sh

      - name: Execute Enterprise Security Audit (14 Tests)
        run: |
          bash tests/test_security_audit.sh

      - name: Execute Enterprise Failure Injection & Chaos Gate (6 Tests)
        run: |
          bash tests/test_failure_injection_scenarios.sh

      - name: Execute Fault Injection & Mutation Resilience (6 Mutants)
        run: |
          bash tests/test_mutation_resilience.sh

      - name: Execute Historical Regression Corpus (REG-001 to REG-007)
        run: |
          bash tests/test_regression_corpus.sh

      - name: Execute Performance Benchmarks & Latency Budgets (4 Metrics)
        run: |
          bash tests/test_benchmarks.sh

      - name: Verify Installer Dry-Run Simulation
        run: |
          DRY_RUN=1 bash installer/scripts/neuronix-install-engine.sh

      - name: Execute Hybrid E2E ISO Installation Engine Gate (8 States)
        run: |
          bash tests/e2e/test_iso_install.sh

      - name: Execute Real OS Installation & Boot Gate (10 Tests)
        run: |
          bash tests/e2e/real/test_real_os_install_boot.sh

      - name: Execute End-to-End Release Lifecycle Gate (34 Tests)
        run: |
          bash tests/test_release_lifecycle.sh

      - name: Execute Reproducible Evaluation Suite (6 Tests)
        run: |
          bash tests/test_reproducible_iso.sh

      - name: Verify Single Source of Truth Test Manifest (1353 Assertions)
        run: |
          python3 tools/generate_test_manifest.py
          git diff -I '"generated_at":' --exit-code data/test_manifest.json

      - name: Execute Independent Conformance Corpus Gate (7 Domains)
        run: |
          bash tests/test_conformance_corpus.sh

      - name: Execute Security Invariants & Fail-Closed Gate (SEC-001 to SEC-020)
        run: |
          bash tests/test_security_invariants.sh

      - name: Execute Storage Planner & 7-Factor Safety Firewall Gate
        run: |
          python3 -m unittest tests/test_storage_planner.py

      - name: Execute Semantic Closure & Subsystem Invariants Gate (37 Tests)
        run: |
          python3 -m unittest tests/test_semantic_closure.py

      - name: Execute Conductor Native Surface & Rust Crate Gate (9 Tests)
        run: |
          cargo test --manifest-path packages/conductor/Cargo.toml

      - name: Execute Conductor Runtime & Socket Activation Gate (10 Tests)
        run: |
          python3 -m unittest tests/test_conductor_runtime.py

      - name: Execute Conductor MCP 2026-07-28 & Authenticated Delegation Gate (8 Tests)
        run: |
          python3 -m unittest tests/test_conductor_mcp.py

      - name: Execute Conductor Control Protocol & RPC Validation Gate (6 Tests)
        run: |
          python3 -m unittest tests/test_control_protocol.py

      - name: Execute Vital Observation Contract & Domain Boundary Gate (4 Tests)
        run: |
          python3 -m unittest tests/test_observation_contract.py

      - name: Execute Vital 16 Collectors & Skills Integration Gate (9 Tests)
        run: |
          python3 -m unittest tests/test_vital_and_skills.py

      - name: Execute Universal Skill System & Delegation Registry Gate (5 Tests)
        run: |
          python3 -m unittest tests/test_skill_system.py

      - name: Execute Negative Reproducibility & Mutation Sensitivity Gate (6 Mutants)
        run: |
          bash tests/test_negative_reproducibility.sh

      - name: Execute Cross-Language Differential Serialization Gate
        run: |
          python3 tests/test_differential_fuzz.py 200

      - name: Compile Assurance Evidence & Generate Verification Passport
        run: |
          python3 tools/compile_evidence.py
          python3 tools/generate_evidence_graph.py
          python3 tools/generate_verification_passport.py
          python3 tools/generate_release_proof.py
          python3 tools/verify_passport.py dist/verification-passport.json --graph --lineage --trace release
          python3 tools/verify_passport.py dist/neuronix-os-v1.0.4.proof.json

      - name: Publish Verified Commit Status to GitHub API
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"success\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"1353/1353 Assertions Verified 100% Green\",\"context\":\"continuous-integration/github-actions\"}"



