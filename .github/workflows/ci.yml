name: NEURONIX OS Industrial CI & Resilience Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Industrial Systems Verification & Release Gate (962 Assertions + Reproducibility)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix with Flakes Support
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Magic Nix Cache (Continuous Binary Caching)
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Setup Local Environment & Tooling
        run: |
          mkdir -p ~/.local/bin
          ln -sf "$PWD/bin/neuronix" ~/.local/bin/neuronix
          echo "$PWD/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Flake Syntax & Derivation Proof
        run: |
          nix-instantiate --parse flake.nix
          nix-instantiate --parse version.nix
          nix-instantiate --parse hosts/iso/default.nix
          nix-instantiate --parse hosts/desktop/default.nix
          nix-instantiate --parse packages/neuronix-cli/default.nix
          nix-instantiate --parse packages/neuronix-center/default.nix
          nix-instantiate --parse packages/opencode/default.nix
          nix-instantiate --parse modules/hardware/boot.nix
          nix-instantiate --parse modules/hardware/secureboot.nix
          nix-instantiate --parse modules/hardware/nvidia-prime.nix
          nix-instantiate --parse modules/services/storage.nix
          nix-instantiate --parse modules/services/flatpak.nix
          nix-instantiate --parse modules/services/opencode.nix
          nix-instantiate --parse modules/services/update.nix
          nix-instantiate --parse modules/services/desktop-tweaks.nix
          nix-instantiate --parse modules/core/manual.nix

      - name: Execute Distro Verification Suite (209 Tests)
        run: |
          bash tests/test_distro_suite.sh

      - name: Execute Master Test Harness (636 Tests)
        run: |
          bash tests/run_all_tests.sh

      - name: Verify System Embedded Manual & AI Reference (37 Tests)
        run: |
          bash tests/test_system_manual.sh

      - name: Execute Core CLI Verification (14 Tests)
        run: |
          bash tests/test_neuronix_core.sh

      - name: Verify Single Source of Truth (10 Tests)
        run: |
          bash tests/test_source_of_truth.sh

      - name: Verify Multi-Architecture Evaluation Matrix (8 Tests)
        run: |
          bash tests/test_multiarch_matrix.sh

      - name: Verify Two-Build Functional Reproducibility (5 Tests)
        run: |
          bash tests/test_two_build_reproducibility.sh

      - name: Verify Multi-Hop Rollback Correctness (8 Tests)
        run: |
          bash tests/test_rollback_correctness.sh

      - name: Execute Enterprise Security Audit (9 Tests)
        run: |
          bash tests/test_security_audit.sh

      - name: Execute Fault Injection & Mutation Resilience (6 Mutants)
        run: |
          bash tests/test_mutation_resilience.sh

      - name: Execute Historical Regression Corpus (REG-001 to REG-007)
        run: |
          bash tests/test_regression_corpus.sh

      - name: Execute Performance Benchmarks & Latency Budgets
        run: |
          bash tests/test_benchmarks.sh

      - name: Verify Installer Dry-Run Simulation
        run: |
          DRY_RUN=1 bash installer/scripts/neuronix-install-engine.sh

      - name: Execute Real E2E ISO Installation & Lifecycle Gate (8 States)
        run: |
          bash tests/e2e/test_iso_install.sh

      - name: Execute End-to-End Release Lifecycle Gate (32 Tests)
        run: |
          bash tests/test_release_lifecycle.sh

      - name: Execute Reproducible Evaluation Suite (6 Tests)
        run: |
          bash tests/test_reproducible_iso.sh
